<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <link rel="stylesheet" href="vendor/xterm.css">
  <style>
    html, body, #terminal-root, #terminal {
      background: #05080d;
      height: 100%;
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      overscroll-behavior: none;
      width: 100%;
    }
    #terminal-root {
      bottom: 0;
      left: 0;
      position: fixed;
      right: 0;
      top: 0;
    }
    #terminal {
      bottom: 0;
      left: 0;
      position: absolute;
      right: 0;
      touch-action: none;
      top: 0;
    }
    .terminal {
      box-sizing: border-box;
      height: 100%;
      padding: 4px;
    }
    .xterm .xterm-viewport {
      background-color: transparent;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: none;
    }
    .xterm .xterm-viewport::-webkit-scrollbar { display: none; }
    #terminal-scrollbar {
      position: absolute;
      top: 4px;
      bottom: 4px;
      right: 0;
      width: 28px;
      touch-action: none;
      user-select: none;
      cursor: pointer;
    }
    #terminal-scrollbar[hidden] { display: none; }
    #terminal-scrollbar::before {
      content: "";
      position: absolute;
      left: 12px;
      width: 4px;
      height: 100%;
      border-radius: 4px;
      background: #1e293b;
    }
    #terminal-scroll-thumb {
      position: absolute;
      left: 8px;
      width: 12px;
      border-radius: 6px;
      background: #64748b;
      cursor: grab;
    }
    #terminal-scrollbar.dragging #terminal-scroll-thumb,
    #terminal-scrollbar:focus-visible #terminal-scroll-thumb { background: #2dd4bf; }
    .history-page {
      display: none;
      position: absolute;
      left: 0;
      width: 28px;
      height: 48px;
      padding: 0;
      border: 1px solid #475569;
      border-radius: 6px;
      background: #1e293b;
      color: #e7f6f2;
      font-size: 18px;
      touch-action: none;
    }
    #history-earlier { top: 0; }
    #history-later { bottom: 0; }
    #terminal-scrollbar.remote-history .history-page { display: block; }
    #terminal-scrollbar.remote-history #terminal-scroll-thumb { display: none; }
    #terminal-scrollbar.remote-history::after {
      content: "↕";
      position: absolute;
      top: calc(50% - 20px);
      left: 2px;
      width: 24px;
      line-height: 40px;
      text-align: center;
      background: #334155;
      border-radius: 6px;
      color: #e7f6f2;
      font-size: 22px;
      pointer-events: none;
    }
    #terminal-scrollbar.remote-history.dragging::after { background: #0f766e; }
    #terminal-status {
      align-items: center;
      background: #05080d;
      bottom: 0;
      color: #22d3ee;
      display: flex;
      font-family: monospace;
      font-size: 12px;
      justify-content: center;
      left: 0;
      padding: 12px;
      position: absolute;
      right: 0;
      text-align: center;
      top: 0;
      z-index: 5;
    }
    #terminal-status.error {
      color: #fb7185;
    }
    #terminal-status.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="terminal-root">
    <div id="terminal"></div>
    <div id="terminal-scrollbar" role="scrollbar" aria-label="Terminal history"
      aria-controls="terminal" aria-orientation="vertical" aria-valuemin="0"
      aria-valuemax="0" aria-valuenow="0" tabindex="0" hidden>
      <div id="terminal-scroll-thumb"></div>
      <button id="history-earlier" class="history-page" aria-label="Earlier history" title="Earlier history">▲</button>
      <button id="history-later" class="history-page" aria-label="Later history" title="Later history">▼</button>
    </div>
    <div id="terminal-status">Loading terminal renderer...</div>
  </div>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="terminal_keys.js"></script>
  <script>
    const terminalElement = document.getElementById("terminal");
    const statusElement = document.getElementById("terminal-status");
    const scrollbar = document.getElementById("terminal-scrollbar");
    const scrollThumb = document.getElementById("terminal-scroll-thumb");
    let scrollbarDragOffset = null;
    let scrollbarNativeDrag = false;
    let lastScrollbarVisible = null;
    let terminalProvider = "";
    let remoteHistoryDragY = null;
    const HISTORY_PAGE_PIXELS = 72;
    let resizeAnchor = null;
    let resizeAnchorTimer = null;
    const fitAddon = new FitAddon.FitAddon();
    const term = new Terminal({
      allowProposedApi: false,
      convertEol: false,
      cursorBlink: true,
      cursorStyle: "block",
      disableStdin: false,
      fontFamily: "monospace",
      fontSize: 12,
      letterSpacing: 0,
      lineHeight: 1.06,
      scrollback: 4000,
      theme: {
        background: "#05080d",
        foreground: "#e7f6f2",
        cursor: "#2dd4bf",
        black: "#111827",
        red: "#fb7185",
        green: "#34d399",
        yellow: "#f59e0b",
        blue: "#60a5fa",
        magenta: "#c084fc",
        cyan: "#22d3ee",
        white: "#f8fafc",
        brightBlack: "#475569",
        brightRed: "#f43f5e",
        brightGreen: "#10b981",
        brightYellow: "#fbbf24",
        brightBlue: "#3b82f6",
        brightMagenta: "#a855f7",
        brightCyan: "#06b6d4",
        brightWhite: "#ffffff"
      }
    });
    term.loadAddon(fitAddon);

    let ready = false;
    let opened = false;
    let lastResize = "";
    let pendingWrites = [];
    let lastQueuedSequence = 0;
    let openAttempts = 0;
    let openTimer = null;
    let lastBackendStatus = "connecting";
    let scrollHandlersInstalled = false;
    let lastTouchY = null;
    let touchScrollRemainder = 0;

    function bridge() {
      return window.TerminalBridge;
    }

    function bridgeCall(method, ...args) {
      const target = bridge();
      if (!target || typeof target[method] !== "function") {
        return;
      }
      try {
        target[method](...args);
      } catch (_) {
      }
    }

    function setRendererStatus(message, isError) {
      statusElement.textContent = message;
      statusElement.classList.toggle("error", Boolean(isError));
      statusElement.classList.toggle("hidden", ready && !isError);
      bridgeCall("status", message);
    }

    function reportError(message) {
      ready = false;
      setRendererStatus(message, true);
      bridgeCall("error", message);
    }

    function reportResize() {
      const key = `${term.cols}x${term.rows}`;
      if (key === lastResize) {
        return;
      }
      lastResize = key;
      bridgeCall("resize", term.cols, term.rows);
    }

    function reportReady() {
      if (!ready) {
        ready = true;
        setRendererStatus(`Terminal renderer ready ${term.cols}x${term.rows}`, false);
        bridgeCall("ready", term.cols, term.rows);
      }
    }

    function fitAndReport() {
      try {
        // Match the server's accepted PTY range, including on large displays.
        const dimensions = fitAddon.proposeDimensions();
        if (!dimensions || !Number.isFinite(dimensions.cols) || !Number.isFinite(dimensions.rows)) {
          scheduleOpenRetry();
          return;
        }
        const buffer = term.buffer.active;
        const readingHistory = buffer.type === "normal" && buffer.viewportY < buffer.baseY;
        if (!resizeAnchor && readingHistory) {
          let anchorLine = buffer.viewportY;
          while (anchorLine > 0 && buffer.getLine(anchorLine)?.isWrapped) anchorLine--;
          resizeAnchor = {
            marker: term.registerMarker(anchorLine - buffer.baseY - buffer.cursorY),
            buffer,
            offset: (buffer.viewportY - anchorLine) * term.cols,
          };
        }
        // Keep one content anchor for the whole IME/rotation animation, rather
        // than capturing partially adjusted viewport positions on each frame.
        const anchor = resizeAnchor;
        const restoreAnchor = () => {
          if (anchor && resizeAnchor === anchor && anchor.marker &&
              !anchor.marker.isDisposed && term.buffer.active === anchor.buffer) {
            term.scrollToLine(anchor.marker.line + Math.floor(anchor.offset / term.cols));
          }
        };
        term.resize(
          Math.max(10, Math.min(300, dimensions.cols)),
          Math.max(2, Math.min(120, dimensions.rows))
        );
        // xterm offsets the viewport when the row count changes. Keep the
        // reader's history position instead of moving it with the live screen.
        if (anchor) {
          restoreAnchor();
          // The WebView's delayed scroll event can undo the synchronous
          // restoration. Restore again once xterm's viewport layout settles.
          window.requestAnimationFrame(() => window.requestAnimationFrame(() => {
            restoreAnchor();
          }));
          if (resizeAnchorTimer !== null) window.clearTimeout(resizeAnchorTimer);
          resizeAnchorTimer = window.setTimeout(() => {
            restoreAnchor();
            cancelResizeAnchor();
          }, 250);
        }
        installScrollHandlers();
        reportResize();
        if (term.cols > 0 && term.rows > 0) {
          reportReady();
          flushPendingWrites();
        }
      } catch (error) {
        reportError(`Terminal fit failed: ${error && error.message ? error.message : error}`);
      }
    }

    function cancelResizeAnchor() {
      if (resizeAnchorTimer !== null) window.clearTimeout(resizeAnchorTimer);
      resizeAnchorTimer = null;
      resizeAnchor?.marker?.dispose();
      resizeAnchor = null;
    }

    function terminalViewport() {
      return terminalElement.querySelector(".xterm-viewport") || terminalElement;
    }

    function terminalCellHeight() {
      const viewport = terminalViewport();
      const byRows = term.rows > 0 ? viewport.clientHeight / term.rows : 0;
      return byRows > 0 ? byRows : 16;
    }

    function terminalCellWidth() {
      const viewport = terminalViewport();
      const byCols = term.cols > 0 ? viewport.clientWidth / term.cols : 0;
      return byCols > 0 ? byCols : 8;
    }

    function terminalUsesAlternateBuffer() {
      const buffers = term && term.buffer ? term.buffer : null;
      const activeBuffer = buffers ? buffers.active : null;
      return Boolean(activeBuffer && (
        activeBuffer.type === "alternate"
        || (buffers.alternate && activeBuffer === buffers.alternate)
      ));
    }

    function terminalMouseTrackingEnabled() {
      return Boolean(term && term.modes && term.modes.mouseTrackingMode !== "none");
    }

    function terminalCellFromClient(clientX, clientY) {
      const rect = terminalElement.getBoundingClientRect();
      const fallbackX = rect.left + (rect.width / 2);
      const fallbackY = rect.top + (rect.height / 2);
      const x = Number.isFinite(clientX) ? clientX : fallbackX;
      const y = Number.isFinite(clientY) ? clientY : fallbackY;
      const col = Math.floor((x - rect.left) / terminalCellWidth()) + 1;
      const row = Math.floor((y - rect.top) / terminalCellHeight()) + 1;
      return {
        col: Math.max(1, Math.min(term.cols || 1, col)),
        row: Math.max(1, Math.min(term.rows || 1, row))
      };
    }

    function sendTerminalWheel(lines, clientX, clientY) {
      if (!ready || !Number.isFinite(lines) || lines === 0) {
        return false;
      }
      if (!terminalMouseTrackingEnabled()) {
        return false;
      }
      const buttonCode = lines < 0 ? 64 : 65;
      const count = Math.min(Math.abs(lines), 12);
      const cell = terminalCellFromClient(clientX, clientY);
      const sequence = `\x1b[<${buttonCode};${cell.col};${cell.row}M`;
      for (let i = 0; i < count; i += 1) {
        bridgeCall("input", sequence);
      }
      return true;
    }

    function sendTerminalPageScroll(lines) {
      if (!ready || !Number.isFinite(lines) || lines === 0) {
        return false;
      }
      const sequence = lines < 0 ? "\x1b[5~" : "\x1b[6~";
      const count = Math.min(Math.max(1, Math.ceil(Math.abs(lines) / 6)), 3);
      for (let i = 0; i < count; i += 1) {
        bridgeCall("input", sequence);
      }
      return true;
    }

    function scrollTerminalByLines(lines, clientX, clientY) {
      cancelResizeAnchor();
      if (!ready || !Number.isFinite(lines) || lines === 0) {
        return false;
      }
      // tmux can suppress alternate-screen sequences while the provider still
      // owns a full-screen transcript. Its history is not in xterm's buffer.
      if (providerOwnsHistory()) return sendTerminalPageScroll(lines);
      if (terminalUsesAlternateBuffer()) {
        if (terminalMouseTrackingEnabled()) {
          return sendTerminalWheel(lines, clientX, clientY);
        }
        return sendTerminalPageScroll(lines);
      }
      term.scrollLines(lines);
      return true;
    }

    function scrollTerminalByPixels(deltaPixels, clientX, clientY) {
      if (!ready || !Number.isFinite(deltaPixels)) {
        return false;
      }
      if (providerOwnsHistory()) {
        // Accumulate physical movement before sending whole-page keys. A
        // terminal-cell-sized drag delta must not become an entire page.
        touchScrollRemainder += deltaPixels;
        const pages = Math.trunc(touchScrollRemainder / HISTORY_PAGE_PIXELS);
        touchScrollRemainder -= pages * HISTORY_PAGE_PIXELS;
        return pages === 0 || scrollTerminalByLines(pages * 6, clientX, clientY);
      }
      const cellHeight = terminalCellHeight();
      const rawLines = (deltaPixels / cellHeight) + touchScrollRemainder;
      const lines = rawLines > 0 ? Math.floor(rawLines) : Math.ceil(rawLines);
      touchScrollRemainder = rawLines - lines;
      if (lines === 0) {
        return true;
      }
      return scrollTerminalByLines(lines, clientX, clientY);
    }

    function wheelDeltaPixels(event) {
      if (event.deltaMode === WheelEvent.DOM_DELTA_LINE) {
        return event.deltaY * terminalCellHeight();
      }
      if (event.deltaMode === WheelEvent.DOM_DELTA_PAGE) {
        return event.deltaY * terminalViewport().clientHeight;
      }
      return event.deltaY;
    }

    function installScrollHandlers() {
      if (scrollHandlersInstalled || !opened) {
        return;
      }
      const target = terminalElement;
      const onWheel = (event) => {
        if (scrollTerminalByPixels(wheelDeltaPixels(event), event.clientX, event.clientY)) {
          event.preventDefault();
          if (terminalUsesAlternateBuffer() && terminalMouseTrackingEnabled()) {
            event.stopPropagation();
          }
        }
      };
      const onTouchStart = (event) => {
        if (event.touches.length !== 1) {
          lastTouchY = null;
          return;
        }
        lastTouchY = event.touches[0].clientY;
        touchScrollRemainder = 0;
      };
      const onTouchMove = (event) => {
        if (event.touches.length !== 1 || lastTouchY === null) {
          lastTouchY = null;
          return;
        }
        const currentY = event.touches[0].clientY;
        const deltaY = lastTouchY - currentY;
        lastTouchY = currentY;
        if (scrollTerminalByPixels(deltaY, event.touches[0].clientX, currentY)) {
          event.preventDefault();
        }
      };
      const onTouchEnd = () => {
        lastTouchY = null;
        touchScrollRemainder = 0;
      };
      target.addEventListener("wheel", onWheel, { capture: true, passive: false });
      target.addEventListener("touchstart", onTouchStart, { capture: true, passive: false });
      target.addEventListener("touchmove", onTouchMove, { capture: true, passive: false });
      target.addEventListener("touchend", onTouchEnd, { capture: true, passive: true });
      target.addEventListener("touchcancel", onTouchEnd, { capture: true, passive: true });
      scrollHandlersInstalled = true;
    }

    function scrollbarGeometry() {
      const buffer = term.buffer.active;
      const rect = scrollbar.getBoundingClientRect();
      const height = Math.min(rect.height, Math.max(48, rect.height * term.rows / (buffer.baseY + term.rows)));
      const travel = Math.max(0, rect.height - height);
      return { buffer, rect, height, travel,
        top: buffer.baseY > 0 ? travel * buffer.viewportY / buffer.baseY : 0 };
    }

    function providerOwnsHistory() {
      return terminalProvider === "codex-fork";
    }

    window.smSetProvider = function(provider) {
      if (terminalProvider === provider) return;
      window.smEndScrollbarDrag();
      terminalProvider = provider;
      touchScrollRemainder = 0;
      updateScrollbar();
    };

    function updateScrollbar() {
      const buffer = term.buffer.active;
      const remote = providerOwnsHistory();
      const visible = remote || (buffer.type === "normal" && buffer.baseY > 0);
      scrollbar.hidden = !visible;
      scrollbar.classList.toggle("remote-history", remote);
      // Provider history has no exposed absolute offset. Present navigation
      // controls instead of inventing a proportional scrollbar position.
      scrollbar.setAttribute("role", remote ? "group" : "scrollbar");
      scrollbar.setAttribute("aria-label", remote ? "Session history: drag up for earlier, down for later" : "Terminal history");
      for (const name of ["aria-valuemin", "aria-valuemax", "aria-valuenow", "aria-orientation"]) {
        if (remote) scrollbar.removeAttribute(name);
      }
      if (visible !== lastScrollbarVisible) {
        lastScrollbarVisible = visible;
        bridgeCall("scrollbarVisibility", visible);
      }
      if (remote) return;
      const { height, top } = scrollbarGeometry();
      scrollThumb.style.height = `${height}px`;
      scrollThumb.style.transform = `translateY(${top}px)`;
      scrollbar.setAttribute("aria-valuemax", String(buffer.baseY));
      scrollbar.setAttribute("aria-valuenow", String(buffer.viewportY));
      scrollbar.setAttribute("aria-valuemin", "0");
      scrollbar.setAttribute("aria-orientation", "vertical");
    }

    window.smBeginScrollbarDrag = function(clientY, fromNative = false) {
      cancelResizeAnchor();
      if (!ready || !Number.isFinite(Number(clientY))) return;
      scrollbarNativeDrag = fromNative;
      if (providerOwnsHistory()) {
        // Preserve the pointer's starting point when Compose takes ownership.
        if (remoteHistoryDragY === null) remoteHistoryDragY = Number(clientY);
        scrollbar.classList.add("dragging");
        window.smDragScrollbar(clientY);
        return;
      }
      if (fromNative && scrollbarDragOffset !== null) {
        window.smDragScrollbar(clientY);
        return;
      }
      const { buffer, rect, height, top } = scrollbarGeometry();
      if (!ready || buffer.type !== "normal" || buffer.baseY === 0) return;
      const y = Number(clientY) - rect.top;
      scrollbarDragOffset = y >= top && y <= top + height ? y - top : height / 2;
      scrollbar.classList.add("dragging");
      window.smDragScrollbar(clientY);
    };

    window.smDragScrollbar = function(clientY) {
      if (providerOwnsHistory()) {
        if (remoteHistoryDragY === null || !Number.isFinite(Number(clientY))) return;
        const pages = Math.trunc((Number(clientY) - remoteHistoryDragY) / HISTORY_PAGE_PIXELS);
        if (pages !== 0) {
          sendTerminalPageScroll(pages * 6);
          remoteHistoryDragY = Number(clientY);
        }
        return;
      }
      if (scrollbarDragOffset === null || !Number.isFinite(Number(clientY))) return;
      const { buffer, rect, travel } = scrollbarGeometry();
      if (buffer.type !== "normal" || travel <= 0) return;
      const fraction = Math.max(0, Math.min(1, (Number(clientY) - rect.top - scrollbarDragOffset) / travel));
      term.scrollToLine(Math.round(fraction * buffer.baseY));
      updateScrollbar();
    };

    window.smEndScrollbarDrag = function() {
      scrollbarDragOffset = null;
      scrollbarNativeDrag = false;
      remoteHistoryDragY = null;
      scrollbar.classList.remove("dragging");
    };

    scrollbar.addEventListener("pointerdown", event => {
      if (event.button !== 0) return;
      event.preventDefault();
      scrollbar.setPointerCapture(event.pointerId);
      window.smBeginScrollbarDrag(event.clientY);
    });
    scrollbar.addEventListener("pointermove", event => {
      if (!scrollbarNativeDrag && (scrollbarDragOffset !== null || remoteHistoryDragY !== null)) {
        event.preventDefault();
        window.smDragScrollbar(event.clientY);
      }
    });
    const endPointerDrag = () => {
      // Compose cancels WebView touch handling when it takes ownership. Its
      // drag continues through the native bridge until native end/cancel.
      if (!scrollbarNativeDrag) window.smEndScrollbarDrag();
    };
    scrollbar.addEventListener("pointerup", endPointerDrag);
    scrollbar.addEventListener("pointercancel", endPointerDrag);
    scrollbar.addEventListener("keydown", event => {
      if (providerOwnsHistory()) {
        const direction = { ArrowUp: -6, PageUp: -6, ArrowDown: 6, PageDown: 6 }[event.key];
        if (direction) {
          event.preventDefault();
          event.stopPropagation();
          sendTerminalPageScroll(direction);
        }
        return;
      }
      const buffer = term.buffer.active;
      if (buffer.type !== "normal") return;
      const targets = { Home: 0, End: buffer.baseY, ArrowUp: buffer.viewportY - 1,
        ArrowDown: buffer.viewportY + 1, PageUp: buffer.viewportY - term.rows,
        PageDown: buffer.viewportY + term.rows };
      if (Object.hasOwn(targets, event.key)) {
        event.preventDefault();
        event.stopPropagation();
        cancelResizeAnchor();
        term.scrollToLine(targets[event.key]);
      }
    });
    term.onScroll(updateScrollbar);
    term.onWriteParsed(updateScrollbar);
    term.onResize(updateScrollbar);
    for (const [id, direction] of [["history-earlier", -6], ["history-later", 6]]) {
      const button = document.getElementById(id);
      button.addEventListener("pointerdown", event => event.stopPropagation());
      button.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        if (providerOwnsHistory()) sendTerminalPageScroll(direction);
      });
    }

    function viewportDimensions() {
      const width = window.innerWidth
        || document.documentElement.clientWidth
        || document.body.clientWidth
        || 0;
      const height = window.innerHeight
        || document.documentElement.clientHeight
        || document.body.clientHeight
        || 0;
      return { width, height };
    }

    function applyViewportSize() {
      const dimensions = viewportDimensions();
      if (dimensions.width > 0) {
        terminalElement.style.width = `${Math.max(0, dimensions.width - 28)}px`;
      }
      if (dimensions.height > 0) {
        terminalElement.style.height = `${dimensions.height}px`;
      }
      return dimensions;
    }

    function hasLayout() {
      const dimensions = applyViewportSize();
      const rect = terminalElement.getBoundingClientRect();
      const width = rect.width || dimensions.width;
      const height = rect.height || dimensions.height;
      return width >= 40 && height >= 40;
    }

    function scheduleOpenRetry() {
      if (openTimer !== null) {
        return;
      }
      openTimer = window.setTimeout(() => {
        openTimer = null;
        ensureTerminalOpen();
      }, 250);
    }

    function ensureTerminalOpen() {
      if (!hasLayout()) {
        openAttempts += 1;
        if (openAttempts === 1 || openAttempts % 4 === 0) {
          setRendererStatus(`Waiting for terminal layout (${lastBackendStatus}, attempt ${openAttempts})`, false);
        }
        scheduleOpenRetry();
        return;
      }
      try {
        if (openTimer !== null) {
          window.clearTimeout(openTimer);
          openTimer = null;
        }
        if (!opened) {
          term.open(terminalElement);
          // The native composer owns IME input. Output taps must not open a second keyboard.
          if (term.textarea) {
            term.textarea.readOnly = true;
            term.textarea.setAttribute("inputmode", "none");
          }
          opened = true;
        }
        fitAndReport();
      } catch (error) {
        reportError(`Terminal open failed: ${error && error.message ? error.message : error}`);
      }
    }

    function bytesFromBase64(payload) {
      const binary = atob(payload);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    function writeFrame(frame) {
      try {
        const data = frame.encoding === "base64" ? bytesFromBase64(frame.payload) : frame.payload;
        const byteCount = frame.encoding === "base64" ? data.length : frame.payload.length;
        term.write(data, () => {
          bridgeCall("written", String(frame.sequence), byteCount);
        });
      } catch (error) {
        reportError(`Terminal write failed: ${error && error.message ? error.message : error}`);
      }
    }

    function flushPendingWrites() {
      if (!ready || pendingWrites.length === 0) {
        return;
      }
      const writes = pendingWrites;
      pendingWrites = [];
      writes.forEach(writeFrame);
    }

    function queueOrWrite(frame) {
      // A bridge retry must never apply cursor motion or text twice.
      if (frame.sequence <= lastQueuedSequence) {
        return;
      }
      lastQueuedSequence = frame.sequence;
      if (!ready) {
        pendingWrites.push(frame);
        setRendererStatus(`Queued ${pendingWrites.length} terminal frames while renderer initializes`, false);
        ensureTerminalOpen();
        return;
      }
      writeFrame(frame);
    }

    term.onData((data) => {
      bridgeCall("input", data);
    });

    term.onResize(() => reportResize());

    window.addEventListener("resize", () => {
      applyViewportSize();
      fitAndReport();
    });

    window.smSendKey = function(key) {
      if (!ready || lastBackendStatus !== "attached") return;
      const data = terminalKeySequence(key, term.modes.applicationCursorKeysMode);
      if (data) bridgeCall("input", data);
    };

    window.smFocus = function() {
      if (ready) {
        term.focus();
      }
    };

    window.smWriteBase64 = function(sequence, payload) {
      queueOrWrite({ sequence: Number(sequence) || 0, payload, encoding: "base64" });
    };

    window.smWriteText = function(sequence, text) {
      queueOrWrite({ sequence: Number(sequence) || 0, payload: text, encoding: "text" });
    };

    window.smSetStatus = function(status) {
      lastBackendStatus = status || lastBackendStatus;
      if (!ready && !statusElement.classList.contains("error")) {
        setRendererStatus(`Backend ${lastBackendStatus}; waiting for terminal renderer`, false);
      }
      if (!ready) {
        ensureTerminalOpen();
      }
    };

    window.smScrollPixels = function(deltaPixels, clientX, clientY) {
      return scrollTerminalByPixels(
        Number(deltaPixels) || 0,
        Number(clientX),
        Number(clientY)
      );
    };

    window.smScrollLines = function(lines, clientX, clientY) {
      const parsed = Number(lines) || 0;
      return scrollTerminalByLines(parsed, Number(clientX), Number(clientY));
    };

    window.smCopySelection = function() {
      let text = term.getSelection() || "";
      if (!text) {
        const buffer = term.buffer.active;
        const lines = [];
        for (let i = 0; i < buffer.length; i += 1) {
          const line = buffer.getLine(i);
          if (line) {
            lines.push(line.translateToString(true));
          }
        }
        text = lines.join("\n").trimEnd();
      }
      bridgeCall("copy", text);
    };

    window.requestAnimationFrame(() => {
      applyViewportSize();
      ensureTerminalOpen();
    });
  </script>
</body>
</html>
