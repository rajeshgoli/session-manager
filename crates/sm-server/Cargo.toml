[package]
name = "sm-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
htmd = "=0.5.5"
markup5ever_rcdom = "0.38"
anyhow = { workspace = true }
axum-server = { version = "0.8", features = ["tls-rustls"] }
axum = { workspace = true, features = ["multipart", "ws"] }
base64 = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures-util = { workspace = true }
hmac = { workspace = true }
instant-acme = { version = "0.8.5", features = ["rcgen"] }
jsonwebtoken = { workspace = true }
libc = { workspace = true }
nix = { workspace = true, features = ["fs", "poll", "resource", "signal", "term"] }
p256 = { workspace = true, features = ["ecdsa", "pem"] }
pulldown-cmark = { workspace = true }
qrcode = { workspace = true }
rand_core = { workspace = true, features = ["getrandom"] }
rusqlite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true, features = ["formatting", "local-offset", "macros", "parsing"] }
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
ureq = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
tokio-tungstenite = "0.29"
